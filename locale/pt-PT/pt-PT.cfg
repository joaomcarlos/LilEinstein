[lil_einstein-strategy-help]
megabase=Investigação focada infinita com a logística contabilizada
balanced=Favorece uma progressão equilibrada com base no valor, custo e ciência disponível. Melhor para uma base geral.
cheapest=Favorece tecnologias com menor custo de ciência. Melhor para avançar rapidamente com passos baratos.
unlocks=Favorece tecnologias que desbloqueiam receitas, qualidade, planetas ou plataformas espaciais. Melhor para abrir um novo nível de produção.
logistics=Favorece melhorias de robôs, transportadores, insertores e logística de veículos. Melhor quando o transporte limita o fluxo de materiais.
combat=Favorece melhorias de armas, torres, artilharia, saúde e robôs de combate. Melhor para expansão ou defesa.
space=Favorece fortemente locais e plataformas espaciais. Melhor para avançar nos marcos de Space Age.
spoilable=Favorece tecnologias que usam ciência perecível. Melhor para consumir ciência perecível antes de expirar.
productivity=Favorece produtividade de receitas, laboratórios e mineração. Melhor para escalar uma megabase e reduzir o consumo de recursos e ciência.
focused=Não cria automaticamente uma nova fila. Melhor quando quer pesquisar apenas tecnologias colocadas na fila ou definidas explicitamente.

