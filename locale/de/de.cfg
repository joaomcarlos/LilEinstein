[lil_einstein-strategy-help]
balanced=Bevorzugt einen ausgewogenen Fortschritt nach Technologiewert, Kosten und verfügbarer Wissenschaft. Am besten für eine allgemeine Basis.
cheapest=Bevorzugt Technologien mit geringeren Wissenschaftskosten. Am besten für schnelle, günstige Fortschritte.
unlocks=Bevorzugt Technologien für Rezepte, Qualität, Planeten und Raumplattformen. Am besten zum Erschließen einer neuen Produktionsstufe.
logistics=Bevorzugt Verbesserungen für Roboter, Bänder, Greifer und Fahrzeuglogistik. Am besten, wenn Transport und Materialdurchsatz bremsen.
combat=Bevorzugt Verbesserungen für Waffen, Geschütztürme, Artillerie, Gesundheit und Kampfroboter. Am besten für Expansion oder Verteidigung.
space=Bevorzugt stark Raumstandorte und Raumplattformen. Am besten für Space-Age-Meilensteine.
spoilable=Bevorzugt Technologien mit verderblicher Wissenschaft. Am besten, damit verderbliche Wissenschaft vor dem Ablauf genutzt wird.
productivity=Bevorzugt Rezept-, Labor- und Bergbauproduktivität. Am besten zum Skalieren einer Megabase und zum Senken von Rohstoff- und Wissenschaftsbedarf.
focused=Erstellt keine neue Warteschlange automatisch. Am besten, wenn nur ausdrücklich eingeplante oder gesetzte Ziele erforscht werden sollen.

