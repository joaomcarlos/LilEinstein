[lil_einstein-strategy-help]
balanced=Favors steady overall progression using normal technology value, cost, and science availability. Best for a general-purpose base.
cheapest=Favors technologies with lower science costs. Best when you want quick, inexpensive progress.
unlocks=Favors technologies that unlock recipes, quality, planets, or space platforms. Best when opening a new production tier.
logistics=Favors robot, belt, inserter, and vehicle logistics improvements. Best when transport and material throughput are bottlenecks.
combat=Favors weapon, turret, artillery, health, and combat-robot improvements. Best when preparing for expansion or defense.
space=Strongly favors space locations and space platforms. Best when pushing Space Age milestones.
spoilable=Favors technologies that use spoilable science. Best when you want to consume spoilable science before it expires.
productivity=Favors recipe, laboratory, and mining productivity. Best for scaling a megabase and reducing resource and science demand.
focused=Does not create a new queue automatically. Best when you want to research only technologies you explicitly queue or target.
megabase=Infinite focused research, accounted for logistics

