[lil_einstein-strategy-help]
balanced=Privilégie une progression équilibrée selon la valeur, le coût et la disponibilité des sciences. Idéale pour une base polyvalente.
cheapest=Privilégie les technologies peu coûteuses en science. Idéale pour avancer rapidement par petites étapes.
unlocks=Privilégie les technologies qui débloquent des recettes, la qualité, des planètes ou des plateformes spatiales. Idéale pour ouvrir un nouveau palier de production.
logistics=Privilégie les améliorations des robots, des tapis roulants, des bras et de la logistique des véhicules. Idéale lorsque le transport limite le débit.
combat=Privilégie les améliorations d'armes, de tourelles, d'artillerie, de santé et de robots de combat. Idéale pour l'expansion ou la défense.
space=Privilégie fortement les lieux et plateformes spatiaux. Idéale pour progresser dans Space Age.
spoilable=Privilégie les technologies utilisant des sciences périssables. Idéale pour consommer ces sciences avant leur expiration.
productivity=Privilégie la productivité des recettes, des laboratoires et de l'exploitation minière. Idéale pour développer une mégabase et réduire les besoins en ressources et en sciences.
focused=Ne remplit pas automatiquement une nouvelle file. Idéale pour rechercher uniquement les technologies mises en file ou ciblées explicitement.

